<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shield ZK Proof Verifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: min(680px, 100%);
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        #reader {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 12px;
        }

        #scanner-status {
            text-align: center;
            margin: 14px 0;
            min-height: 24px;
        }

        button {
            display: block;
            margin: 16px auto;
            padding: 12px 20px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .hidden {
            display: none !important;
        }

        .verification-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
        }

        .verified {
            background: #e9f8ee;
            border: 1px solid #76c893;
        }

        .invalid {
            background: #fff0f0;
            border: 1px solid #e57373;
        }

        .event {
            padding: 8px 10px;
            margin: 4px 0;
            background: rgba(0,0,0,.04);
            border-radius: 8px;
            word-break: break-all;
        }

        .quiz-hint {
            opacity: .75;
        }
    </style>
</head>

<body>

<main class="container">

    <h1>Shield ZK Proof Verifier</h1>

    <p>
        Scan the QR generated by the prover. The QR contains the
        Groth16 proof JSON and 24 public signals.
    </p>

    <div id="reader"></div>

    <div id="scanner-status">
        Initialising scanner...
    </div>

    <button id="scan-again" class="hidden">
        Scan Again
    </button>

    <section id="result-section" class="hidden">
        <div id="result-card"></div>
    </section>

</main>

<!-- QR camera scanner -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- Local verifier -->
<script type="module" src="./app.js"></script>

</body>
</html>
